
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QZ7 Test Website</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08080c;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bg {
  position: fixed;
  width: 300px;
  height: 300px;
  background: #762bff;
  filter: blur(150px);
  opacity: .2;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #08080c;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity .7s, visibility .7s;
}

.loader {
  width: 38px;
  height: 38px;
  border: 3px solid #292431;
  border-top-color: #a66cff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#loading.hide {
  opacity: 0;
  visibility: hidden;
}

.content {
  position: relative;
  text-align: center;
  padding: 30px;
  opacity: 0;
  transform: translateY(15px);
  transition: .8s ease;
}

.content.show {
  opacity: 1;
  transform: translateY(0);
}

.logo {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 5px;
  margin-bottom: 12px;
  background: linear-gradient(120deg, white, #a77aff);
  -webkit-background-clip: text;
  color: transparent;
}

p {
  color: #85818f;
  font-size: 14px;
  margin-bottom: 30px;
}

button {
  border: 1px solid #8050ce;
  background: linear-gradient(135deg, #8246e9, #5521a8);
  color: white;
  padding: 15px 45px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 5px 30px #813fff30;
  transition: .2s;
}

button:active {
  transform: scale(.94);
}

#message {
  margin-top: 22px;
  color: #b994ff;
  font-size: 13px;
  opacity: 0;
  transition: .3s;
}

#message.show {
  opacity: 1;
}
</style>
</head>

<body>

<div class="bg"></div>

<div id="loading">
  <div class="loader"></div>
  <span style="color:#85818f;font-size:13px">
    Loading Experience...
  </span>
</div>

<main class="content" id="content">
  <div class="logo">QZ7</div>
  <p>Welcome to our website</p>

  <button onclick="testButton()">
    Test Button
  </button>

  <div id="message">
    System is working successfully!
  </div>
</main>

<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("loading")
      .classList.add("hide");

    document.getElementById("content")
      .classList.add("show");
  }, 1200);
});

function testButton() {
  const msg = document.getElementById("message");
  msg.classList.add("show");
  msg.textContent = "✓ Button is working!";
}
</script>

</body>
</html>
