<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DxqqK</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08080c;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bg {
  position: fixed;
  width: 300px;
  height: 300px;
  background: #762bff;
  filter: blur(150px);
  opacity: .2;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #08080c;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity .7s, visibility .7s;
}

.loader {
  width: 38px;
  height: 38px;
  border: 3px solid #292431;
  border-top-color: #a66cff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#loading.hide {
  opacity: 0;
  visibility: hidden;
}

.content {
  position: relative;
  text-align: center;
  padding: 30px;
  opacity: 0;
  transform: translateY(15px);
  transition: .8s ease;
  max-width: 420px;
  width: 100%;
}

.content.show {
  opacity: 1;
  transform: translateY(0);
}

.logo {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: 4px;
  margin-bottom: 8px;
  background: linear-gradient(120deg, white, #a77aff);
  -webkit-background-clip: text;
  color: transparent;
}

.server-name {
  color: #b994ff;
  font-size: 15px;
  margin-bottom: 28px;
  font-weight: 500;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.stat {
  background: #12121a;
  border: 1px solid #2a2a38;
  border-radius: 14px;
  padding: 14px 18px;
  min-width: 90px;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: white;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 12px;
  color: #85818f;
}

.stat.online .stat-value {
  color: #43b581;
}

.stat.offline .stat-value {
  color: #747f8d;
}

.stat.total .stat-value {
  color: #a66cff;
}

a.join-btn {
  display: inline-block;
  border: 1px solid #8050ce;
  background: linear-gradient(135deg, #8246e9, #5521a8);
  color: white;
  padding: 15px 45px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 5px 30px #813fff30;
  transition: .2s;
}

a.join-btn:active {
  transform: scale(.94);
}

#message {
  margin-top: 22px;
  color: #b994ff;
  font-size: 13px;
  opacity: 0;
  transition: .3s;
}

#message.show {
  opacity: 1;
}
</style>
</head>

<body>

<div class="bg"></div>

<div id="loading">
  <div class="loader"></div>
  <span style="color:#85818f;font-size:13px">
    Loading Experience...
  </span>
</div>

<main class="content" id="content">
  <div class="logo">DxqqK</div>
  <div class="server-name" id="serverName">Discord Server</div>

  <div class="stats">
    <div class="stat total">
      <div class="stat-value" id="totalMembers">-</div>
      <div class="stat-label">สมาชิกทั้งหมด</div>
    </div>
    <div class="stat online">
      <div class="stat-value" id="onlineMembers">-</div>
      <div class="stat-label">ออนไลน์</div>
    </div>
    <div class="stat offline">
      <div class="stat-value" id="offlineMembers">-</div>
      <div class="stat-label">ออฟไลน์</div>
    </div>
  </div>

  <a class="join-btn" href="https://discord.gg/8RdTumnEK" target="_blank" rel="noopener">
    เข้าร่วม Discord
  </a>

  <div id="message"></div>
</main>

<script>
const INVITE_CODE = "8RdTumnEK";
const DISCORD_URL = `https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`;

async function fetchDiscordStats() {
  try {
    let res = await fetch(DISCORD_URL, { mode: "cors" });
    
    if (!res.ok) {
      res = await fetch(`https://corsproxy.io/?${encodeURIComponent(DISCORD_URL)}`);
    }
    
    if (!res.ok) throw new Error("fetch failed");
    
    const data = await res.json();
    
    const total = data.approximate_member_count || data.profile?.member_count || 0;
    const online = data.approximate_presence_count || data.profile?.online_count || 0;
    const offline = Math.max(0, total - online);
    const name = data.guild?.name || data.profile?.name || "DxqqK";

    document.getElementById("serverName").textContent = name;
    document.getElementById("totalMembers").textContent = total.toLocaleString();
    document.getElementById("onlineMembers").textContent = online.toLocaleString();
    document.getElementById("offlineMembers").textContent = offline.toLocaleString();
    
  } catch (err) {
    document.getElementById("serverName").textContent = "DxqqK";
    document.getElementById("totalMembers").textContent = "22";
    document.getElementById("onlineMembers").textContent = "5";
    document.getElementById("offlineMembers").textContent = "17";
    
    const msg = document.getElementById("message");
    msg.textContent = "แสดงข้อมูลล่าสุด";
    msg.classList.add("show");
  }
}

window.addEventListener("load", () => {
  fetchDiscordStats();
  
  setTimeout(() => {
    document.getElementById("loading").classList.add("hide");
    document.getElementById("content").classList.add("show");
  }, 1200);
});
</script>

</body>
</html>
